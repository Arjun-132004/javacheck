apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: javacheck-backend-github-client-secret
  namespace: storefront-dev222
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: deepagent-aws
    kind: ClusterSecretStore
  target:
    name: app-env
    creationPolicy: Merge
  data:
    - secretKey: GITHUB_CLIENT_SECRET
      remoteRef:
        key: teams-dev/storefront-dev222/GITHUB_CLIENT_SECRET
