apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: javacheck-backend
  namespace: storefront-developer
  labels:
    app.kubernetes.io/name: javacheck-backend
    app.kubernetes.io/managed-by: deepagent
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: javacheck-backend
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
