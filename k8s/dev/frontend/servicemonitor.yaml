apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: javacheck-frontend
  namespace: storefront-devops
  labels:
    app.kubernetes.io/name: javacheck-frontend
    app.kubernetes.io/managed-by: deepagent
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: javacheck-frontend
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
